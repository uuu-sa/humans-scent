<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>人間の残り香 - 資料アーカイブ</title>
    <style>
        /* 全体の雰囲気：深い夜の空気感 */
        :root {
            --bg-color: #0a0c10;
            --text-color: #e6edf3;
            --accent-color: #ffbf00; /* 琥珀色（暖かさ） */
            --sub-text: #8b949e;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            font-family: "Hiragino Mincho ProN", "MS Mincho", serif;
            margin: 0;
            line-height: 1.6;
            overflow-x: hidden;
        }

        /* 杉浦康平を意識した「時間の地層」インジケーター */
        .time-axis {
            position: fixed;
            right: 40px;
            top: 50%;
            transform: translateY(-50%);
            width: 1px;
            height: 70vh;
            background: linear-gradient(to bottom, var(--accent-color), transparent);
            z-index: 100;
        }

        .time-axis::before {
            content: "今 (数分前)";
            position: absolute;
            top: -40px;
            right: -10px;
            font-size: 12px;
            color: var(--accent-color);
            writing-mode: vertical-rl;
        }

        .time-axis::after {
            content: "過去 (数年前)";
            position: absolute;
            bottom: -40px;
            right: -10px;
            font-size: 12px;
            color: var(--sub-text);
            writing-mode: vertical-rl;
        }

        header {
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        header h1 {
            font-size: 3rem;
            letter-spacing: 0.5em;
            color: var(--accent-color);
            margin-bottom: 20px;
        }

        .scroll-down {
            margin-top: 100px;
            font-size: 0.8rem;
            color: var(--sub-text);
            letter-spacing: 0.2em;
            animation: bounce 2s infinite;
        }

        @keyframes bounce {
            0%, 20%, 50%, 80%, 100% {transform: translateY(0);}
            40% {transform: translateY(-10px);}
            60% {transform: translateY(-5px);}
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            padding-bottom: 300px;
        }

        .item {
            margin-bottom: 40vh;
            position: relative;
            display: flex;
            flex-direction: column;
            transition: opacity 1s, transform 1s;
        }

        /* 左右に散らす配置 */
        .item:nth-child(even) { align-items: flex-start; }
        .item:nth-child(odd) { align-items: flex-end; }

        .photo-frame {
            position: relative;
            width: 80%;
            max-width: 500px;
            overflow: hidden;
            cursor: crosshair;
        }

        .photo-frame img {
            width: 100%;
            height: auto;
            display: block;
            filter: sepia(30%) brightness(0.8);
            transition: filter 0.6s ease;
        }

        /* ホバーで出るビフォーストーリー */
        .story-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 12, 16, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            transition: opacity 0.5s ease;
            padding: 40px;
            box-sizing: border-box;
            text-align: center;
        }

        .photo-frame:hover .story-overlay {
            opacity: 1;
        }

        .photo-frame:hover img {
            filter: sepia(0%) brightness(1);
        }

        .story-text {
            color: var(--accent-color);
            font-size: 1.4rem;
            line-height: 1.8;
        }

        .caption {
            margin-top: 20px;
            font-size: 0.9rem;
            color: var(--sub-text);
            letter-spacing: 0.1em;
        }

        footer {
            height: 30vh;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 0.7rem;
            color: var(--sub-text);
            letter-spacing: 0.3em;
        }

        /* スクロールアニメーション用 */
        .fade-in {
            opacity: 0;
            transform: translateY(50px);
        }

        .fade-in.visible {
            opacity: 1;
            transform: translateY(0);
        }

    </style>
</head>
<body>

    <div class="time-axis"></div>

    <header>
        <h1>人間の残り香</h1>
        <p>収集とログによる気配のアーカイブ</p>
        <div class="scroll-down">SCROLL DOWN</div>
    </header>

    <div class="container">
        
        <!-- Depth 1: 数分前 -->
        <div class="item fade-in">
            <div class="photo-frame">
                <img src="S__51347489_0.jpg" alt="カバン">
                <div class="story-overlay">
                    <div class="story-text">「持ち主お出かけ中」</div>
                </div>
            </div>
            <div class="caption">Depth 01: 数分前の気配</div>
        </div>

        <!-- Depth 2: 数時間前 -->
        <div class="item fade-in">
            <div class="photo-frame">
                <img src="S__51347493_0.jpg" alt="お皿">
                <div class="story-overlay">
                    <div class="story-text">ごちそうさまのあと、<br>まだ体温が混ざっている</div>
                </div>
            </div>
            <div class="caption">Depth 02: 数時間前の余韻</div>
        </div>

        <!-- Depth 3: 数日前 -->
        <div class="item fade-in">
            <div class="photo-frame">
                <img src="S__51347494_0.jpg" alt="靴">
                <div class="story-overlay">
                    <div class="story-text">追いかけっこに置いていかれた、<br>片方だけのさよなら</div>
                </div>
            </div>
            <div class="caption">Depth 03: 数日前の形跡</div>
        </div>

        <!-- Depth 4: 数年前 -->
        <div class="item fade-in">
            <div class="photo-frame">
                <img src="S__51347492_0.jpg" alt="傘">
                <div class="story-overlay">
                    <div class="story-text">晴れた瞬間に、<br>他人になったビニール</div>
                </div>
            </div>
            <div class="caption">Depth 04: 数年前の遺構</div>
        </div>

    </div>

    <footer>
        &copy; HUMAN SCENT ARCHIVES / SACHI
    </footer>

    <script>
        // スクロールに合わせて要素を表示させる
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting) {
                    entry.target.classList.add('visible');
                }
            });
        }, { threshold: 0.2 });

        document.querySelectorAll('.fade-in').forEach(el => {
            observer.observe(el);
        });
    </script>
</body>
</html>
